[project]
name = "cite-and-seek"
version = "0.1.0"
description = "Evaluation-first RAG over the Franklindot04/ecommerce-api codebase"
authors = [
    { name = "meenuviji", email = "85398595+meenuviji@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.12.0",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
cite-and-seek = "cite_and_seek.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# corpus/tests holds upstream test files that are corpus content, not project tests.
testpaths = ["tests"]
