[project]
name = "cite-and-seek"
version = "0.1.0"
description = "Evaluation-first RAG over the Franklindot04/ecommerce-api codebase"
authors = [
    { name = "meenuviji", email = "85398595+meenuviji@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
cite-and-seek = "cite_and_seek.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
